name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run editor and PWA Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_DEV_CROSS_ORIGIN_ISOLATION: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Download pinned U2NetP model
        run: npm run models:download
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real U2NetP inference and cache tests
        run: npm run test:e2e:inference
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-inference
          path: playwright-report/
          retention-days: 7
